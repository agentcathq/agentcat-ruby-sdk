name: Release

# Two steps, with a pull request between them, as in the Java and Rust SDKs. CONTRIBUTING.md
# ("Release a version") has the steps and the one-time setup.
#
# 1. A manual run (Actions > Release > Run workflow) with `patch` (the default), `minor`, `major` or
#    an exact version X.Y.Z opens the pull request "Release vX.Y.Z". It sets the version in
#    lib/agentcat/version.rb and Gemfile.lock and dates the [Unreleased] section of the CHANGELOG
#    (`ruby scripts/release.rb prepare`). A pull request that GITHUB_TOKEN opens starts no
#    workflow, so the run starts ci.yml and mcp-compat.yml on the release branch itself.
# 2. The merge of that pull request into main publishes the version: when the version of
#    version.rb has no tag and the CHANGELOG has its dated section (`ruby scripts/release.rb
#    status`), the run waits for the ci.yml run of the merge commit, publishes the gem to
#    RubyGems with trusted publishing, and then creates the tag vX.Y.Z and its GitHub release. A
#    failed step publishes nothing after it; the tag comes last, so a re-run of the failed jobs
#    continues the release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: patch, minor, major, or an exact version X.Y.Z
        required: true
        default: patch
        type: string
  push:
    branches: [main]
    paths:
      - lib/agentcat/version.rb
      - CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: The run is on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release workflow on main, not on $GITHUB_REF_NAME"
          exit 1
      # The full history holds the tags that the next version counts from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # scripts/release.rb needs only the standard library: no bundle install.
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
      - name: Set the version and date the CHANGELOG
        id: prepare
        env:
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(ruby scripts/release.rb prepare "$INPUT" "$(date -u +%F)")"
          # RubyGems never accepts a version twice, not even a yanked one.
          if curl -sSf https://rubygems.org/api/v1/versions/agentcat.json | jq -e --arg v "$version" 'any(.[]; .number == $v)' > /dev/null; then
            echo "::error::RubyGems already has agentcat $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add lib/agentcat/version.rb Gemfile.lock CHANGELOG.md
          git commit -m "Release v$VERSION"
          git push origin "$branch"
          ruby scripts/release.rb notes "$VERSION" > notes.md
          {
            echo "Merging this pull request publishes the \`agentcat\` gem $VERSION to RubyGems, then tags \`v$VERSION\` and creates its GitHub release with these notes:"
            echo
            cat notes.md
          } > body.md
          gh pr create --base main --head "$branch" --title "Release v$VERSION" --body-file body.md
          gh workflow run ci.yml --ref "$branch"
          gh workflow run mcp-compat.yml --ref "$branch"

  status:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.status.outputs.version }}
      publish: ${{ steps.status.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
      - name: Is this version released?
        id: status
        run: |
          set -euo pipefail
          read -r version action <<<"$(ruby scripts/release.rb status)"
          echo "agentcat $version: $action"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$action" = publish ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: status
    if: needs.status.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    # The environment is the one that the trusted publisher of agentcat on RubyGems names.
    environment:
      name: release
      url: https://rubygems.org/gems/agentcat/versions/${{ needs.status.outputs.version }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.status.outputs.version }}
    steps:
      # The CI run of this push to main checks the commit on every Ruby; the gem goes out only
      # when it passes.
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 85); do
            read -r status conclusion <<<"$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '.workflow_runs | sort_by(.run_attempt) | last | "\(.status // "none") \(.conclusion // "none")"')"
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then
                echo "CI passed on $GITHUB_SHA"
                exit 0
              fi
              echo "::error::CI on $GITHUB_SHA ended with $conclusion; re-run CI, then re-run this job"
              exit 1
            fi
            sleep 60
          done
          echo "::error::CI on $GITHUB_SHA did not finish in time"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
      - name: Build the gem
        run: |
          set -euo pipefail
          gem build agentcat.gemspec --output "agentcat-$VERSION.gem"
      # Trusted publishing: RubyGems trades this job's OIDC token for a short-lived API key in
      # GEM_HOST_API_KEY. GitHub stores no RubyGems secret.
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      # A re-run after a publish that went through skips the publish.
      - name: Publish to RubyGems
        id: publish
        run: |
          set -euo pipefail
          if curl -sSf https://rubygems.org/api/v1/versions/agentcat.json | jq -e --arg v "$VERSION" 'any(.[]; .number == $v)' > /dev/null; then
            echo "RubyGems already has agentcat $VERSION"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gem push "agentcat-$VERSION.gem"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # A signed statement of the commit and the workflow that built this gem, through the same
      # OIDC token (Sigstore). `gh attestation verify <gem> -R agentcathq/agentcat-ruby-sdk` checks it.
      - name: Attest the build provenance
        if: steps.publish.outputs.pushed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: agentcat-${{ env.VERSION }}.gem

  github-release:
    needs: [status, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.status.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
      - name: Tag the commit and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ruby scripts/release.rb notes "$VERSION" > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
